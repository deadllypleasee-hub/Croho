name: Build CHRONOS APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chronos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android API ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [23, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Check, test and build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify app flow on API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            ./gradlew --no-daemon connectedDebugAndroidTest
            python3 .github/scripts/capture_previews.py
      - name: Prepare installable APK
        if: matrix.api == 35
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/CHRONOS.apk
          cd dist
          sha256sum CHRONOS.apk > CHRONOS.apk.sha256
      - name: Upload APK
        if: matrix.api == 35
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: CHRONOS-APK
          path: dist/*
          if-no-files-found: error
          retention-days: 90
      - name: Link APK in run summary
        if: matrix.api == 35
        env:
          ARTIFACT_URL: ${{ steps.apk.outputs.artifact-url }}
        run: |
          echo "### CHRONOS APK" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download CHRONOS-APK]($ARTIFACT_URL) — unzip and install CHRONOS.apk." >> "$GITHUB_STEP_SUMMARY"
          echo "Built from commit $GITHUB_SHA. Debug-signed APK; Android 6.0 or newer." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CHRONOS-checks-API-${{ matrix.api }}
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
